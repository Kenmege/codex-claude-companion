name: Finalize PR 48 bot push

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.repository == 'Kenmege/codex-claude-companion' &&
      github.event.pull_request.number == 48 &&
      github.event.pull_request.head.ref == 'copilot/fix-auto-review-failure' &&
      github.actor == 'Kenmege'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: copilot/fix-auto-review-failure
          fetch-depth: 0
          persist-credentials: true

      - name: Make the final bot-authored documentation correction
        env:
          HEAD_REF: copilot/fix-auto-review-failure
        run: |
          python3 -c 'from pathlib import Path; p = Path(".github/workflows/claude.yml"); data = p.read_text(); marker = "$" + "{{ github.token }}"; quote = chr(34); needle = "          github_token: " + marker + "\n          allowed_bots: " + quote + "Copilot,claude" + quote + "\n"; replacement = "          # Use the workflow token so allow-listed app actors avoid\n          # the action OIDC collaborator gate.\n" + needle; assert data.count(needle) == 2, "unexpected Claude action input count"; p.write_text(data.replace(needle, replacement)); Path(".github/workflows/finalize-pr48.yml").unlink()'
          git diff --check
          test -n "$(git status --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/claude.yml .github/workflows/finalize-pr48.yml
          git commit -m "Document bot authentication path"
          git push origin "HEAD:${HEAD_REF}"
