name: Finalize PR 48 bot push

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    # Every dynamic identity is compared to an exact repository, PR, branch,
    # and owner value. The checkout ref below is hard-coded, not interpolated.
    if: >-
      github.repository == 'Kenmege/codex-claude-companion' &&
      github.event.pull_request.number == 48 &&
      github.event.pull_request.head.ref == 'copilot/fix-auto-review-failure' &&
      github.actor == 'Kenmege'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: copilot/fix-auto-review-failure
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for removal, then make the final bot-authored change
        env:
          HEAD_REF: copilot/fix-auto-review-failure
        run: |
          for attempt in {1..90}; do
            git fetch origin "${HEAD_REF}"
            if ! git cat-file -e "origin/${HEAD_REF}:.github/workflows/finalize-pr48.yml" 2>/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 90 ]; then
              echo "Timed out waiting for the temporary finalizer to be removed" >&2
              exit 1
            fi
            sleep 2
          done
          git switch --detach "origin/${HEAD_REF}"
          python3 -c 'from pathlib import Path; p = Path("AGENTS.md"); data = p.read_text(); needle = "These requirements apply to every pull request, including dependency-only, documentation-only, and automation-authored changes.\n"; replacement = "These requirements apply to every pull request, including dependency-only, documentation-only, configuration-only, and automation-authored changes.\n"; assert data.count(needle) == 1 and replacement not in data, "unexpected AGENTS.md scope text"; p.write_text(data.replace(needle, replacement))'
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- AGENTS.md
          git commit -m "Clarify pull request integrity coverage"
          git push origin "HEAD:${HEAD_REF}"
